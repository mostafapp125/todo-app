<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Waffle House</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    /* Navbar */
    header {
      position: fixed;
      width: 100%;
      top: 0;
      background-color: #d97706;
      color: white;
      padding: 15px;
      text-align: center;
      z-index: 1000;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Sections */
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      padding-top: 60px;
    }

    html {
      scroll-snap-type: y mandatory;
    }

    #home {
      background: #fff7ed;
    }

    #menu {
      background: #ffedd5;
      width: 100%;
    }

    #contact {
      background: #fed7aa;
    }

    /* Menu Grid */
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 80%;
      padding: 20px;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .price {
      color: #d97706;
      font-weight: bold;
    }

    button {
      background-color: #d97706;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>
  <h2>🧇 Waffle House</h2>
  <nav>
    <a href="#home">الرئيسية</a>
    <a href="#menu">المنيو</a>
    <a href="#contact">تواصل معنا</a>
  </nav>
</header>

<!-- Home -->
<section class="page" id="home">
  <h1>أحلى وافل في البلد 😍</h1>
  <p>طازة – سخن – بطعم يجنن</p>
</section>

<!-- Menu -->
<section class="page" id="menu">
  <h2>المنيو</h2>

  <div class="menu">
    <div class="item">
      <h3>وافل شوكولاتة</h3>
      <p class="price">40 جنيه</p>
      <button>اطلب الآن</button>
    </div>

    <div class="item">
      <h3>وافل فراولة</h3>
      <p class="price">45 جنيه</p>
      <button>اطلب الآن</button>
    </div>

    <div class="item">
      <h3>وافل نوتيلا</h3>
      <p class="price">50 جنيه</p>
      <button>اطلب الآن</button>
    </div>
  </div>
</section>
<p id="start">popo</p>
<!-- Contact -->
<section class="page" id="contact">
  <h2>تواصل معنا</h2>
  <p>📞 01017905311</p>
  <p>📍 مصر</p>
</section>

<script>
  // Smooth scroll من النافبار
  document.querySelectorAll("nav a").forEach(link => {
    link.addEventListener("click", function(e) {
      e.preventDefault();
      let target = this.getAttribute("href");
      document.querySelector(target).scrollIntoView({
        behavior: "smooth"
      });
    });
  });

  // واتساب
  let buttons = document.querySelectorAll("button");
  let phoneNumber = "201017905311";

  buttons.forEach(btn => {
    btn.addEventListener("click", function() {
      let itemName = this.parentElement.querySelector("h3").textContent;
      let price = this.parentElement.querySelector(".price").textContent;

      let message = `مرحبًا، أريد طلب ${itemName} بسعر ${price}`;
      let url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

      window.open(url, "_blank");

      this.textContent = "✔ تم الطلب";
      this.style.backgroundColor = "green";
    });
  });
</script>

</body>
</html>
